<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiches jeux – Vectria</title>
<meta name="description" content="Fiche info de chacun de nos jeux : description, publicités, sécurité des données et confidentialité.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="games" data-title-fr="Fiches jeux – Vectria" data-title-en="Game info – Vectria">

<main class="wrap">
  <div class="page-title">
    <h1 data-fr="Fiches info jeux" data-en="Game info sheets">Fiches info jeux</h1>
    <p data-fr="Choisis un jeu : sa description, ses publicités, la sécurité de tes données et ses règles de confidentialité." data-en="Pick a game: its description, ads, data security and privacy rules.">Choisis un jeu : sa description, ses publicités, la sécurité de tes données et ses règles de confidentialité.</p>
  </div>

  <div class="picker" id="picker" role="group" aria-label="Jeux / Games"></div>
  <article class="panel" id="sheet" aria-live="polite"></article>
</main>

<script src="data.js"></script>
<script src="site.js"></script>
<script>
(function () {
  var V = window.VECTRIA, S = window.Site, L = S.L, esc = S.esc;
  var BASE = 'https://vectriaa-max.github.io/privacy.html';
  var T = {
    version: { fr: 'Version', en: 'Version' }, age: { fr: 'Âge', en: 'Age' }, langs: { fr: 'Langues', en: 'Languages' },
    about: { fr: 'Le jeu', en: 'The game' }, money: { fr: 'Publicités & achats', en: 'Ads & purchases' },
    safety: { fr: 'Sécurité des données', en: 'Data security' },
    rules: { fr: 'Confidentialité & règles de sécurité', en: 'Privacy & safety rules' },
    ads: { fr: 'Publicités', en: 'Ads' }, buy: { fr: 'Achats intégrés', en: 'In-app purchases' }, noBuy: { fr: 'Aucun achat intégré : le jeu est entièrement gratuit.', en: 'No in-app purchases: the game is completely free.' },
    account: { fr: 'Compte à créer', en: 'Account required' }, collected: { fr: 'Données collectées', en: 'Data collected' },
    shared: { fr: 'Partagées avec', en: 'Shared with' }, sold: { fr: 'Données vendues', en: 'Data sold' }, enc: { fr: 'Chiffrées en transit', en: 'Encrypted in transit' },
    del: { fr: 'Suppression', en: 'Deletion' }, no: { fr: 'Non', en: 'No' }, yes: { fr: 'Oui', en: 'Yes' },
    byAds: { fr: 'Pour la pub', en: 'For ads' }, uninstall: { fr: 'Désinstaller le jeu', en: 'Uninstall the game' },
    partner: { fr: 'Partenaire publicitaire', en: 'Advertising partner' },
    officialPage: { fr: 'Page officielle des règles de ce jeu :', en: 'Official rules page for this game:' },
    play: { fr: 'Google Play', en: 'Google Play' }, soon: { fr: 'Bientôt sur Google Play', en: 'Coming soon to Google Play' },
    langsVal: { fr: 'FR · EN · ES · PT', en: 'FR · EN · ES · PT' },
  };
  var current = null;

  function sharedWith(g) {
    var w = [L(T.partner)];
    if (g.playGames) w.push('Google Play Jeux');
    if (g.purchases) w.push(L({ fr: 'Google Play (paiement)', en: 'Google Play (payment)' }));
    return w.join(', ');
  }

  // Full safety rules for one game, written for players (no technical detail)
  function rules(g) {
    var fr = S.lang === 'fr', r = [];
    r.push(fr ? '<b>Aucun compte.</b> ' + g.name + ' ne te demande ni nom, ni adresse e-mail, ni mot de passe.'
              : '<b>No account.</b> ' + g.name + ' never asks for your name, email address or password.');
    r.push(fr ? '<b>Tes données restent chez toi.</b> Sur ton téléphone uniquement : ' + esc(L(g.localData)) + '. Nos équipes ne les reçoivent jamais.'
              : '<b>Your data stays with you.</b> On your phone only: ' + esc(L(g.localData)) + '. Our team never receives it.');
    r.push(fr ? '<b>Publicité.</b> Pour afficher et mesurer les publicités, notre partenaire publicitaire utilise l’identifiant publicitaire de ton téléphone, des informations générales sur l’appareil et une localisation approximative. Ces données sont chiffrées pendant leur transfert et ne sont jamais vendues.'
              : '<b>Ads.</b> To show and measure ads, our advertising partner uses your phone’s advertising ID, general device information and an approximate location. This data is encrypted in transit and never sold.');
    r.push(fr ? '<b>Ton choix.</b> En Europe, le jeu te demande ton accord avant d’afficher des publicités personnalisées, et tu peux changer d’avis à tout moment dans ses paramètres. Les vidéos récompensées sont toujours facultatives.'
              : '<b>Your choice.</b> In Europe, the game asks for your consent before showing personalized ads, and you can change your mind at any time in its settings. Reward videos are always optional.');
    if (g.purchases) r.push(fr ? '<b>Achats.</b> Le paiement passe uniquement par Google Play : nous ne voyons jamais tes coordonnées bancaires. Le jeu reçoit seulement la confirmation de l’achat pour débloquer l’option.'
              : '<b>Purchases.</b> Payment goes only through Google Play: we never see your payment details. The game only receives the purchase confirmation to unlock the option.');
    if (g.playGames) r.push(fr ? '<b>Classement.</b> Si tu te connectes à Google Play Jeux, ton pseudo, ton avatar et tes scores sont partagés avec Google Play Jeux pour afficher le classement et les succès. La connexion est facultative.'
              : '<b>Leaderboard.</b> If you sign in to Google Play Games, your gamer name, avatar and scores are shared with Google Play Games to show the leaderboard and achievements. Signing in is optional.');
    r.push(g.age === '18+'
      ? (fr ? '<b>Âge.</b> Réservé aux adultes (18 ans et plus). Le jeu évoque l’alcool : à consommer avec modération, chacun peut refuser un défi.'
            : '<b>Age.</b> Adults only (18+). The game refers to alcohol: please drink responsibly, anyone can skip a challenge.')
      : (fr ? '<b>Âge.</b> Le jeu s’adresse aux joueurs de 13 ans et plus. Nous ne collectons pas sciemment de données sur les enfants.'
            : '<b>Age.</b> The game is for players aged 13 and over. We do not knowingly collect data about children.'));
    r.push(fr ? '<b>Tes droits.</b> Désinstaller le jeu efface toutes ses données. Tu peux réinitialiser ton identifiant publicitaire dans les réglages de ton téléphone, et nous écrire pour toute question : <code>' + esc(V.contact) + '</code>.'
              : '<b>Your rights.</b> Uninstalling the game erases all its data. You can reset your advertising ID in your phone settings, and email us with any question: <code>' + esc(V.contact) + '</code>.');
    return '<ol class="rules">' + r.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol>';
  }

  function render() {
    var g = S.game(current) || V.games[0];
    var url = BASE + '#' + g.id;
    document.getElementById('picker').innerHTML = V.games.map(function (x) {
      return '<button type="button" data-id="' + x.id + '" aria-pressed="' + (x.id === g.id) + '"><img src="' + x.icon + '" alt="">' + esc(x.name) + '</button>';
    }).join('');
    var live = g.status === 'live';
    document.getElementById('sheet').innerHTML =
      '<div class="sheet-head"><img src="' + g.icon + '" alt="">' +
        '<div><div class="meta"><span class="tag">' + esc(L(g.genre)) + '</span><span class="badge-st' + (live ? ' live' : '') + '">' + esc(S.statusLabel(g)) + '</span></div>' +
        '<h2>' + esc(g.name) + '</h2><p>' + esc(L(g.short)) + '</p></div></div>' +
      '<div class="facts">' +
        '<div class="fact"><small>' + L(T.version) + '</small><b>' + esc(g.version) + '</b></div>' +
        '<div class="fact"><small>' + L(T.age) + '</small><b' + (g.age === '18+' ? ' class="age"' : '') + '>' + esc(g.age) + '</b></div>' +
        '<div class="fact"><small>' + L(T.langs) + '</small><b>' + L(T.langsVal) + '</b></div>' +
        '<div class="fact"><small>' + L(T.buy) + '</small><b>' + (g.purchases ? L(T.yes) : L(T.no)) + '</b></div>' +
      '</div>' +
      '<div class="sheet-grid">' +
        '<section class="panel"><h3><span class="dot"></span>' + L(T.about) + '</h3><ul>' + L(g.features).map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul></section>' +
        '<section class="panel"><h3><span class="dot"></span>' + L(T.money) + '</h3>' +
          '<p><b>' + L(T.ads) + ' : </b>' + esc(L(g.ads)) + '</p>' +
          '<p><b>' + L(T.buy) + ' : </b>' + esc(g.purchases ? L(g.purchases) : L(T.noBuy)) + '</p></section>' +
        '<section class="panel" style="grid-column:1/-1"><h3><span class="dot"></span>' + L(T.safety) + '</h3><dl class="kv kv-wide">' +
          '<dt>' + L(T.account) + '</dt><dd class="no">' + L(T.no) + '</dd>' +
          '<dt>' + L(T.collected) + '</dt><dd class="yes">' + L(T.byAds) + '</dd>' +
          '<dt>' + L(T.shared) + '</dt><dd>' + esc(sharedWith(g)) + '</dd>' +
          '<dt>' + L(T.sold) + '</dt><dd class="no">' + L(T.no) + '</dd>' +
          '<dt>' + L(T.enc) + '</dt><dd class="no">' + L(T.yes) + '</dd>' +
          '<dt>' + L(T.del) + '</dt><dd>' + L(T.uninstall) + '</dd>' +
        '</dl></section>' +
        '<section class="panel" style="grid-column:1/-1" id="rules-' + g.id + '"><h3><span class="dot"></span>' + L(T.rules) + '</h3>' +
          rules(g) +
          '<p class="rules-url">' + L(T.officialPage) + ' <a href="privacy.html#' + g.id + '">' + esc(url) + '</a></p>' +
        '</section>' +
      '</div>' +
      '<div class="sheet-foot">' +
        (live ? '<a class="btn play big" href="' + S.playUrl(g) + '" target="_blank" rel="noopener">▶ ' + L(T.play) + '</a>' : '<span class="btn ghost big" aria-disabled="true">⏳ ' + L(T.soon) + '</span>') +
      '</div>';
  }

  document.getElementById('picker').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-id]'); if (!b) return;
    current = b.getAttribute('data-id');
    history.replaceState(null, '', '#' + current);
    render();
    document.getElementById('sheet').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  function fromHash() { var h = location.hash.slice(1); if (h === 'arrowly') h = 'fletchy'; current = S.game(h) ? h : V.games[0].id; }
  window.addEventListener('hashchange', function () { fromHash(); render(); });
  fromHash();
  Site.onLang(render);
})();
</script>
</body>
</html>
